<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI NPC 酒館 Demo</title>
<style>
:root{--bg:#10131a;--panel:#191e29;--line:#344052;--text:#f7f3e8;--muted:#aeb7c4;--gold:#f5c66b;--ok:#70d7a2;--bad:#ff7b86}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}body{display:grid;place-items:center;padding:18px}.shell{width:min(1180px,100%);display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px}
.game-card,.side{border:1px solid var(--line);background:var(--panel);border-radius:20px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.28)}
.topbar{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.title{font-weight:800}.subtitle{font-size:12px;color:var(--muted)}
.stage-wrap{position:relative;background:#0b0e13}canvas{display:block;width:100%;aspect-ratio:16/10;background:#20251f}.hud{position:absolute;left:14px;top:14px;display:flex;gap:8px;flex-wrap:wrap}
.badge{padding:7px 10px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(10,12,16,.75);font-size:12px}.prompt{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:10px 14px;border:1px solid rgba(245,198,107,.45);background:rgba(10,12,16,.9);border-radius:12px;color:#ffe2a7;font-size:13px;display:none}
.side{padding:16px;display:flex;flex-direction:column;min-height:640px}.side h2{font-size:18px;margin:0 0 5px}.side p{font-size:12px;color:var(--muted);line-height:1.55;margin:0 0 14px}label{display:block;font-size:12px;color:var(--muted);margin:11px 0 6px}
select,input{width:100%;border:1px solid var(--line);background:#0f141c;color:var(--text);border-radius:11px;padding:10px 11px;outline:none}.info{margin-top:12px;padding:11px;border:1px solid var(--line);background:#111720;border-radius:12px;font-size:12px;line-height:1.55;color:var(--muted)}.info.ok{color:#bbf7d0;border-color:rgba(112,215,162,.38)}.info.bad{color:#fecdd3;border-color:rgba(255,123,134,.38)}
.log{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;flex:1}.log-title{font-size:12px;color:var(--muted);margin-bottom:8px}.logbox{height:260px;overflow:auto}.line{padding:8px 10px;border-radius:10px;background:#111720;margin-bottom:7px;font-size:12px;line-height:1.45}.line b{color:var(--gold)}
.controls{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding:13px 16px;display:flex;gap:18px;flex-wrap:wrap}.chat-overlay{position:fixed;inset:0;background:rgba(5,7,10,.72);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.chat{width:min(760px,100%);height:min(680px,88vh);border:1px solid var(--line);background:#10151d;border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 100px rgba(0,0,0,.5)}.chat-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.npc{display:flex;align-items:center;gap:11px}.portrait{width:42px;height:42px;border-radius:12px;background:#8a5d38;display:grid;place-items:center;font-size:23px}.npc strong{display:block}.npc small{color:var(--muted)}
.close{border:1px solid var(--line);background:#171e28;color:var(--text);border-radius:10px;padding:8px 11px;cursor:pointer}.messages{flex:1;overflow:auto;padding:16px}.msg{display:flex;margin:11px 0}.msg.user{justify-content:flex-end}.bubble{max-width:78%;padding:11px 13px;border-radius:14px;background:#1a2230;line-height:1.6;font-size:14px;white-space:pre-wrap}.msg.user .bubble{background:#f0e7d2;color:#171717}.chat-input{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px}.chat-input input{flex:1}.send{border:0;background:var(--gold);color:#21190a;border-radius:11px;padding:0 16px;font-weight:800;cursor:pointer}.send:disabled{opacity:.5}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{min-height:auto}.logbox{height:180px}}
</style></head>
<body>
<div class="shell">
<section class="game-card">
<div class="topbar"><div><div class="title">暮燈酒館</div><div class="subtitle">AI NPC API 接法示範</div></div><div class="subtitle">任務：向酒館老闆打聽北邊森林</div></div>
<div class="stage-wrap"><canvas id="game" width="960" height="600"></canvas><div class="hud"><div class="badge">HP 100</div><div class="badge">金幣 42</div><div class="badge" id="providerBadge">AI：OpenAI</div></div><div class="prompt" id="interactPrompt">按 E 與老闆交談</div></div>
<div class="controls"><span>WASD / 方向鍵：移動</span><span>E：交談</span><span>Esc：關閉對話</span></div>
</section>
<aside class="side">
<h2>API 設定</h2><p>遊戲前端完全不放 API Key。Key 存到 Cloudflare Secret，玩家看原始碼也拿不到。</p>
<label for="provider">AI 供應商</label><select id="provider"><option value="openai">OpenAI</option><option value="gemini">Google Gemini</option></select>
<div id="backend" class="info">正在檢查後端…</div>
<div class="info"><b>這個 Demo 傳給 AI 的遊戲狀態</b><br>NPC：酒館老闆・羅德<br>地點：暮燈酒館<br>玩家任務：調查北邊森林的異常狼群<br>對話記憶：保留最近 8 輪</div>
<div class="log"><div class="log-title">遊戲事件</div><div class="logbox" id="logbox"></div></div>
</aside></div>
<div class="chat-overlay" id="overlay"><div class="chat"><div class="chat-head"><div class="npc"><div class="portrait">🧔</div><div><strong>酒館老闆・羅德</strong><small id="npcStatus">正在擦杯子</small></div></div><button class="close" id="closeChat">關閉</button></div><div class="messages" id="messages"><div class="msg"><div class="bubble">歡迎來到暮燈酒館。要喝點什麼，還是想打聽消息？</div></div></div><div class="chat-input"><input id="chatInput" autocomplete="off" placeholder="例如：北邊森林最近怎麼了？"><button class="send" id="sendBtn">送出</button></div></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),promptEl=document.getElementById('interactPrompt'),overlay=document.getElementById('overlay'),messagesEl=document.getElementById('messages'),chatInput=document.getElementById('chatInput'),sendBtn=document.getElementById('sendBtn'),provider=document.getElementById('provider'),providerBadge=document.getElementById('providerBadge'),backend=document.getElementById('backend'),logbox=document.getElementById('logbox'),npcStatus=document.getElementById('npcStatus');
const player={x:170,y:420,r:16,speed:3.2},npc={x:700,y:210,r:22},keys={};let chatOpen=false,busy=false,history=[];
function log(t){const d=document.createElement('div');d.className='line';d.innerHTML=t;logbox.prepend(d)}function nearNPC(){return Math.hypot(player.x-npc.x,player.y-npc.y)<92}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function draw(){ctx.fillStyle='#303326';ctx.fillRect(0,0,960,600);ctx.strokeStyle='rgba(255,255,255,.055)';for(let y=0;y<600;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(960,y);ctx.stroke()}for(let x=0;x<960;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,600);ctx.stroke()}rect(0,0,960,32,'#4c3a2b');rect(0,0,28,600,'#4c3a2b');rect(932,0,28,600,'#4c3a2b');rect(590,90,300,52,'#6b472f');rect(590,140,300,16,'#3f2b20');ctx.fillStyle='#d9a45d';ctx.font='16px system-ui';ctx.fillText('BAR',712,122);[[190,160],[350,315],[720,430]].forEach(([x,y])=>{ctx.fillStyle='#6b4d34';ctx.beginPath();ctx.arc(x,y,46,0,Math.PI*2);ctx.fill();ctx.fillStyle='#392c23';ctx.beginPath();ctx.arc(x,y,34,0,Math.PI*2);ctx.fill()});rect(60,70,120,72,'#46372d');rect(76,90,88,52,'#191512');ctx.fillStyle='#f28c45';ctx.beginPath();ctx.arc(120,123,20,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c28a54';ctx.beginPath();ctx.arc(npc.x,npc.y,npc.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2c211a';ctx.fillRect(npc.x-15,npc.y+18,30,30);ctx.fillStyle='#fff4d6';ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillText('羅德',npc.x,npc.y-33);if(nearNPC()){ctx.strokeStyle='#f5c66b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(npc.x,npc.y,40,0,Math.PI*2);ctx.stroke()}ctx.fillStyle='#6bb3ff';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#182638';ctx.fillRect(player.x-12,player.y+13,24,28);ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.fillText('你',player.x,player.y-26);ctx.textAlign='start'}
function update(){if(!chatOpen){let dx=0,dy=0;if(keys.w||keys.arrowup)dy--;if(keys.s||keys.arrowdown)dy++;if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;if(dx||dy){const m=Math.hypot(dx,dy);player.x=clamp(player.x+dx/m*player.speed,48,912);player.y=clamp(player.y+dy/m*player.speed,58,560)}}promptEl.style.display=nearNPC()&&!chatOpen?'block':'none'}function loop(){update();draw();requestAnimationFrame(loop)}loop();
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k==='e'&&nearNPC()&&!chatOpen)openChat();if(k==='escape'&&chatOpen)closeChat()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function openChat(){chatOpen=true;overlay.style.display='flex';chatInput.focus();log('<b>互動：</b>你走近了酒館老闆。')}function closeChat(){chatOpen=false;overlay.style.display='none'}document.getElementById('closeChat').onclick=closeChat;
function addBubble(role,text){const row=document.createElement('div');row.className='msg '+(role==='user'?'user':'');const b=document.createElement('div');b.className='bubble';b.textContent=text;row.appendChild(b);messagesEl.appendChild(row);messagesEl.scrollTop=messagesEl.scrollHeight}
async function sendChat(){const text=chatInput.value.trim();if(!text||busy)return;busy=true;sendBtn.disabled=true;chatInput.value='';addBubble('user',text);history.push({role:'user',content:text});npcStatus.textContent='正在想…';try{const r=await fetch('/api/npc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:provider.value,npcId:'tavern_keeper',message:text,history:history.slice(-16),gameState:{location:'暮燈酒館',quest:'調查北邊森林的異常狼群',questStage:1,playerGold:42}})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);const reply=data.text||'……';history.push({role:'assistant',content:reply});addBubble('assistant',reply);log(`<b>${provider.value==='openai'?'OpenAI':'Gemini'}：</b>NPC 已產生新回覆。`)}catch(err){addBubble('assistant','（API 呼叫失敗：'+err.message+'）');log('<b>錯誤：</b>'+err.message)}finally{busy=false;sendBtn.disabled=false;npcStatus.textContent='正在擦杯子';chatInput.focus()}}
sendBtn.onclick=sendChat;chatInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChat()}});provider.addEventListener('change',()=>{providerBadge.textContent='AI：'+(provider.value==='openai'?'OpenAI':'Gemini');log('<b>系統：</b>切換至 '+(provider.value==='openai'?'OpenAI':'Google Gemini'))});
(async()=>{try{const r=await fetch('/api/health',{cache:'no-store'}),d=await r.json();if(!r.ok)throw 0;backend.className='info ok';backend.textContent=`後端正常｜OpenAI：${d.openai?'已設定':'未設定'}｜Gemini：${d.gemini?'已設定':'未設定'}`}catch(e){backend.className='info bad';backend.textContent='後端未啟動。請用 Cloudflare Pages Functions / Wrangler 執行。'}})();log('<b>系統：</b>進入暮燈酒館。走到羅德旁邊按 E。');
</script></body></html>
